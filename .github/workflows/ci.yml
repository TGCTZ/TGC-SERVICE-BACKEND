name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # The suite itself runs on in-memory SQLite, but migrations are checked
    # against PostgreSQL, which is what production actually uses.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: djangoapitemplate
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SECRET_KEY: ci-only-not-a-real-secret
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/djangoapitemplate
      DEBUG: "False"

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Security check against production settings
        # Django's own deployment audit: HSTS, secure cookies, DEBUG, and a
        # weak SECRET_KEY. --fail-level WARNING makes a regression fail CI
        # rather than print a notice nobody reads.
        run: uv run python manage.py check --deploy --fail-level WARNING
        env:
          DJANGO_SETTINGS_MODULE: config.settings.production
          ALLOWED_HOSTS: example.com

      - name: Check for missing migrations
        run: uv run python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SETTINGS_MODULE: config.settings.development

      - name: Migrate against PostgreSQL
        run: uv run python manage.py migrate
        env:
          DJANGO_SETTINGS_MODULE: config.settings.development

      - name: Test
        run: uv run pytest --cov --cov-report=term-missing
